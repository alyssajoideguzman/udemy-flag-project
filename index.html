<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */
    /* red rectangle */
    .flag {
        background-color: #ce1126;
        height: 600px;
        width: 900px;
        
    }

    /* The Flag text */
    .flag p{
        font-size: 80px;
        height: 150px;
        margin: 0px;
        text-align: center;
        color: white;
    }

    /* blue rectangle */
    .flag div  {
        background-color: #002868;
        height: 300px;
    }

    /* white circle */
    .flag div div {
        background-color: white;
        height: 200px;
        width: 200px;
        border-radius: 50%;
        position: absolute;
        left: 350px;
        top: 200px;
    }

    /* of Laos text */
    .flag div p{
        color: black;
        text-align: center;
        font-size: 80px;  
    }
    
  </style>
</head>

<!-- 
  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors 
and CSS specificity instead.
Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
Hint 2: You can use CSS inspection to get the colors from
https://appbrewery.github.io/flag-of-laos/
-->

<body>
 <div class="flag">   <!--whole flag red bg -->
    <p>The Flag</p> 
    <div> <!--blue rectangle-->
      <div> <!--white circle-->
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
